<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="color-scheme" content="dark">
<title>Тест клавиатуры</title>
<script src="https://telegram.org/js/telegram-web-app.js?59"></script>
<style>
  :root{ --bg:#141416; --panel:#222327; --text:#f2f2f2; --muted:#8b8d93; --accent:#e5197f; }
  html{ height:100%; background:var(--bg); }
  body{ margin:0; height:100%; background:var(--bg); color:var(--text);
        font:16px/1.35 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
        overflow:hidden; overscroll-behavior:none; -webkit-text-size-adjust:100%; }
  /* Высота корня берётся из --tg-viewport-height. На iOS это самый ранний сигнал:
     Telegram присылает конечную высоту в момент старта анимации клавиатуры,
     а саму рамку WebView меняет с опозданием ~0.5 с (на открытии).
     visualViewport на закрытии вообще залипает на старом значении.
     Анимировать высоту не надо: сигнал приходит с опозданием, анимация только добавит лаг. */
  #app{ position:fixed; top:0; left:0; right:0; height:var(--tg-viewport-height, 100%);
        display:flex; flex-direction:column; background:var(--bg); }
  #hud{ font:11px/1.3 ui-monospace,Menlo,Consolas,monospace; color:var(--muted);
        padding:6px 12px; padding-top:calc(6px + env(safe-area-inset-top)); white-space:pre; }
  #log{ flex:1; min-height:0; overflow-y:auto; -webkit-overflow-scrolling:touch;
        padding:8px 12px; display:flex; flex-direction:column; gap:8px; overscroll-behavior:contain; }
  .msg{ background:var(--panel); padding:10px 12px; border-radius:16px; max-width:80%;
        align-self:flex-end; word-break:break-word; }
  .msg.in{ align-self:flex-start; }

  /* Нижний блок: лента кнопок + строка ввода. Всё в потоке flex-колонки, без position:fixed и без JS-отступов. */
  #bottom{ flex:none; background:var(--bg); padding-bottom:env(safe-area-inset-bottom); }
  #chips{ display:flex; gap:8px; padding:6px 12px; overflow-x:auto; -webkit-overflow-scrolling:touch;
          scrollbar-width:none; overscroll-behavior-x:contain; }
  #chips::-webkit-scrollbar{ display:none; }
  .chip{ flex:none; border:0; border-radius:999px; padding:9px 14px; background:var(--panel);
         color:var(--text); font-size:14px; white-space:nowrap; -webkit-tap-highlight-color:transparent; }
  .chip:active{ opacity:.7; }
  #bar{ display:flex; align-items:center; gap:8px; margin:0; padding:6px 12px 8px; }
  .ico{ flex:none; width:44px; height:44px; border:0; border-radius:14px; background:var(--panel);
        color:var(--muted); font-size:20px; -webkit-tap-highlight-color:transparent; }
  #field{ flex:1; min-width:0; display:flex; align-items:center; gap:8px; background:var(--panel);
          border-radius:14px; padding:0 8px 0 12px; }
  #emoji{ flex:none; border:0; background:none; color:var(--muted); font-size:20px; padding:0; }
  #inp{ flex:1; min-width:0; font-size:16px; /* 16px — iOS не зумит страницу при фокусе */
        padding:12px 0; border:0; background:none; color:var(--text); outline:none; -webkit-appearance:none; }
  #send{ flex:none; width:44px; height:44px; border-radius:14px; border:0; background:var(--accent);
         color:#fff; font-size:18px; -webkit-tap-highlight-color:transparent; }
</style>
</head>
<body>
<div id="app">
  <div id="hud">…</div>
  <div id="log">
    <div class="msg in">Напиши что-нибудь. Проверяем, как открывается и уезжает клавиатура. Тап по этой области прячет клавиатуру.</div>
  </div>
  <div id="bottom">
    <div id="chips">
      <button class="chip" type="button">📷 Попросить уникальное фото</button>
      <button class="chip" type="button">🎁 Подарить подарок</button>
      <button class="chip" type="button">⭐ Открыть набор</button>
      <button class="chip" type="button">💬 Продолжить</button>
      <button class="chip" type="button">🔥 Ещё кнопка</button>
    </div>
    <form id="bar" autocomplete="off">
      <button class="ico" id="attach" type="button" aria-label="Вложение">📎</button>
      <div id="field">
        <button id="emoji" type="button" aria-label="Эмодзи">🙂</button>
        <input id="inp" type="text" placeholder="Введите сообщение" enterkeyhint="send" autocomplete="off" autocorrect="off">
      </div>
      <button id="send" type="submit" aria-label="Отправить">➤</button>
    </form>
  </div>
</div>
<script>
(function(){
  var tg = window.Telegram && Telegram.WebApp;
  var BG = '#141416';
  if (tg) {
    tg.ready();
    tg.expand();
    /* Цвет под WebView = цвет страницы. Даже если рамка отстанет от клавиатуры,
       "дырка" будет того же цвета, а не чёрной. */
    try { tg.setBackgroundColor(BG); } catch(e){}
    try { tg.setHeaderColor(BG); } catch(e){}
    try { tg.setBottomBarColor(BG); } catch(e){}
    try { tg.disableVerticalSwipes(); } catch(e){}
  }

  var hud = document.getElementById('hud'), log = document.getElementById('log'),
      bar = document.getElementById('bar'), inp = document.getElementById('inp');
  var n = 0;
  function draw(){
    var vv = window.visualViewport;
    hud.textContent = 'inner ' + window.innerHeight
      + '  visual ' + (vv ? Math.round(vv.height) : '-')
      + '  tg ' + (tg ? Math.round(tg.viewportHeight) : '-')
      + '  stable ' + (tg ? Math.round(tg.viewportStableHeight) : '-')
      + '  events ' + n;
  }
  window.addEventListener('resize', draw);
  if (window.visualViewport) {
    visualViewport.addEventListener('resize', draw);
    visualViewport.addEventListener('scroll', draw);
  }
  if (tg) tg.onEvent('viewportChanged', function(){ n++; draw(); });
  draw();

  /* iOS иногда прокручивает сам документ, чтобы показать поле ввода. Возвращаем на место. */
  window.addEventListener('scroll', function(){ if (window.scrollY) window.scrollTo(0, 0); }, { passive:true });

  function add(text, incoming){
    var d = document.createElement('div');
    d.className = incoming ? 'msg in' : 'msg';
    d.textContent = text; log.appendChild(d);
    log.scrollTop = log.scrollHeight;
  }

  bar.addEventListener('submit', function(e){
    e.preventDefault();
    var t = inp.value.trim(); if (!t) return;
    add(t); inp.value = '';
    /* фокус не отпускаем: клавиатура не моргает между сообщениями */
  });

  /* ГЛАВНОЕ для кнопок над клавиатурой: pointerdown + preventDefault.
     Тап по кнопке тогда не переносит фокус с поля ввода, клавиатура не закрывается
     и не открывается заново. Скролл ленты пальцем при этом работает. Click приходит как обычно. */
  function keepFocus(el){ el.addEventListener('pointerdown', function(e){ e.preventDefault(); }); }
  keepFocus(document.getElementById('send'));
  keepFocus(document.getElementById('attach'));
  keepFocus(document.getElementById('emoji'));
  var chips = document.querySelectorAll('.chip');
  for (var i = 0; i < chips.length; i++) {
    keepFocus(chips[i]);
    chips[i].addEventListener('click', function(){
      var t = this.textContent.trim();
      add(t);
      setTimeout(function(){ add('Ок, получил: ' + t, true); }, 300);
    });
  }
  document.getElementById('attach').addEventListener('click', function(){ add('📎 вложение (заглушка)'); });
  document.getElementById('emoji').addEventListener('click', function(){ inp.value += '🙂'; });

  /* Тап по списку сообщений прячет клавиатуру. */
  log.addEventListener('click', function(){ inp.blur(); });
})();
</script>
</body>
</html>
